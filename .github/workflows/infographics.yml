name: Infographics
on:
  # Schedule hourly updates
  schedule: [{cron: "0 */8 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main /commit
  push: {branches: ["master", "main"]}
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Compact display
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.achievements.compact.svg
          token: ${{ secrets.ISOMETRICS_TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_achievements: yes
          plugin_achievements_only: >-
            polyglot, stargazer, sponsor, deployer, member, maintainer, developer, scripter, packager, explorer, infographile, manager
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          # contribution calender
      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.ISOMETRICS_TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Activity graph
      - name: Recent activity charts
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.charts.svg
          token: ${{ secrets.ISOMETRICS_TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Europe/Paris
      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.activity.svg
          token: ${{ secrets.ISOMETRICS_TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
      - name: Most used (with details)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.details.svg
          token: ${{ secrets.ISOMETRICS_TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 4
      - name: Pinned repositories
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.repositories.pinned.svg
          token: ${{ secrets.ISOMETRICS_TOKEN }}
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_repositories: yes
          plugin_repositories_pinned: 2
      - name: Favorites anime and currently watching
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.svg
          token: NOT_NEEDED
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_anilist: yes
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, watching
          plugin_anilist_user: dekustik
          plugin_anilist_limit: 1
          # Youtube Music
      - name: Youtube Music - Recently listed
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_music_token: ${{ secrets.YOUTUBE_MUSIC_TOKENS }}
          plugin_music: yes
          plugin_music_mode: recent
          plugin_music_provider: youtube
      - name: Recent posts with descriptions and cover images
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.posts.full.svg
          token: NOT_NEEDED
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_posts: yes
          plugin_posts_source: dev.to
          plugin_posts_user: hishantik
          plugin_posts_limit: 2
          plugin_posts_descriptions: yes
          plugin_posts_covers: yes
      - name: WakaTime
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.wakatime.svg
          token: NOT_NEEDED
          base: ""
          output_action: gist
          committer_gist: ${{ secrets.ISOGIST }}
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
